name: Release
on:
  push:
    branches:
      - master
permissions:
  contents: write
  pull-requests: write
  id-token: write
jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          versioning-strategy: always-bump-patch
      # Checkout
      - uses: actions/checkout@v4
        if: ${{ steps.release.outputs.release_created }}
      - name: setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.2
      # Setup node
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
        if: ${{ steps.release.outputs.release_created }}
      # Install dependencies
      - run: pnpm install
        if: ${{ steps.release.outputs.release_created }}
      # Build output
      - run: pnpm run build
        if: ${{ steps.release.outputs.release_created }}
      # Publish to npm
      - run: pnpm run pub
        if: ${{ steps.release.outputs.release_created }}
